services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: books
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d books"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    volumes:
      - ./media:/media:ro
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/books
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    ports:
      - "127.0.0.1:8080:8080" 
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME}
      API_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
